# Apache dedicado al Sistema de Gestion de Equipos - The Villa Group
# Independiente del httpd.conf de XAMPP: solo sirve este proyecto en el puerto 8000.

<IfDefine !VILLA_ROOT>
    Define VILLA_ROOT "C:/Users/sistemas/Desktop/ventasAlmacen22"
</IfDefine>
<IfDefine !VILLA_PORT>
    Define VILLA_PORT 8000
</IfDefine>

ServerRoot "C:/xampp/apache"
Listen 0.0.0.0:${VILLA_PORT}
# localhost resuelve primero a ::1; sin esto cada conexion local espera ~2 s
Listen [::1]:${VILLA_PORT}
ServerName localhost:${VILLA_PORT}
PidFile "${VILLA_ROOT}/servidor/logs/httpd.pid"
ServerTokens Prod
ServerSignature Off

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so

LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/xampp/php"

# Hilos simultaneos; el hijo se recicla periodicamente para liberar memoria acumulada.
ThreadsPerChild 150
MaxConnectionsPerChild 20000

Timeout 300
KeepAlive On
MaxKeepAliveRequests 200
KeepAliveTimeout 5
RequestReadTimeout header=20-40,MinRate=500 body=60,MinRate=500

TypesConfig conf/mime.types
AddType application/manifest+json .webmanifest
AddType application/x-x509-ca-cert .crt
DirectoryIndex index.php index.html

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "${VILLA_ROOT}"
<Directory "${VILLA_ROOT}">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Carpetas y archivos internos que no deben descargarse desde el navegador
<DirectoryMatch "^${VILLA_ROOT}/(\.git|servidor|scripts)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "\.(bat|ps1|sql|log|ini|md|dist)$|^\.">
    Require all denied
</FilesMatch>

<Files "sw.js">
    Header set Cache-Control "no-cache"
</Files>

ErrorLog "|bin/rotatelogs.exe -n 3 ${VILLA_ROOT}/servidor/logs/apache-error.log 10M"
LogLevel warn
LogFormat "%h %t \"%r\" %>s %b %D" villa
SetEnvIf Request_URI "^/sw\.js$" no_log
CustomLog "|bin/rotatelogs.exe -n 5 ${VILLA_ROOT}/servidor/logs/apache-access.log 10M" villa env=!no_log
